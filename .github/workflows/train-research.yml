name: Train Football Lab (research only)
on:
  push:
    branches: [main]
    paths:
      - training_lab.py
      - train_research.py
      - .github/workflows/train-research.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: football-lab-research-training
  cancel-in-progress: false
jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Football Lab
        uses: actions/checkout@v4
      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run offline regression tests
        run: python -m unittest discover -s tests -v
      - name: Train rolling-season benchmarks on five men's leagues
        run: |
          python train_research.py --league PL --league PD --league BL1 --league SA --league FL1 --advanced
      - name: Publish training research report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: football-lab-training-report
          path: data/training_report.json
          if-no-files-found: warn
      - name: Publish public research diagnostics for Streamlit
        if: success()
        run: |
          git config user.name "football-lab-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/training_report.json
          if git diff --cached --quiet; then
            echo "No changes to research results."
          else
            git commit -m "Update research-only rolling-season model training results"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
