name: Validate Football Lab
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Check Python syntax
        run: python -m compileall -q app.py advanced_engine.py data_source.py live_data.py club_engine.py club_data.py club_ui.py understat_data.py advanced_club_experiment.py advanced_ui.py weekly_scout.py mobile_dashboard.py research_ui.py tests
      - name: Run offline regression tests
        run: python -m unittest discover -s tests -v
